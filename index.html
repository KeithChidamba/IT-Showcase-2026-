<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="logo.jpg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beyond the Frame</title>
<!-- Archivo variable font (weight 100-900): every rule variant (thin, regular, bold, heavy...) is a weight on this axis -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@100..900&display=swap">
<link rel="stylesheet" href="stylesheet.css">
<style id="fontcss"></style>
</head>
<body>
<button id="menutoggle" type="button" aria-controls="topbar" aria-expanded="true" title="Hide the menu">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
<span id="menutogglelabel">Hide menu</span>
</button>
<div id="workspace">
<div id="topbar" aria-label="Menu">
<div id="controls">
<div class="group">
<h2 class="section-title">Text input</h2>
<div class="row">
<input type="text" id="input" placeholder="Type a word or phrase" aria-label="Word or phrase">
<button class="primary" id="ok">OK</button>
<button id="sample">Fill sample</button>
<button id="clearinput" title="Empty the text box only (the canvas is left as it is)">Clear input</button>
<span id="status" role="status"></span>
</div>
</div>
<div class="group">
<h2 class="section-title">Canvas controls</h2>
<div class="row">
<button id="undo" title="Remove the most recently added word (password required)">Undo</button>
<button id="clear" title="Remove every word from the canvas (password required)">Clear Canvas</button>
<button id="invert" type="button" aria-pressed="false" title="Place the words around the letters instead of inside them">Invert</button>
</div>
</div>
<div class="group">
<h2 class="section-title">Voice input</h2>
<div class="row" id="voicerow">
<button id="mic" type="button" aria-pressed="false" title="Speak a word or phrase">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
<span id="miclabel">Speak</span>
</button>
<select id="voicelang" aria-label="Speech language">
<option value="en-ZA">English (ZA)</option>
<option value="af-ZA">Afrikaans</option>
<option value="en-GB">English (UK)</option>
<option value="en-US">English (US)</option>
</select>
<span id="voiceStatus" role="status"></span>
</div>
</div>
<div class="group">
<h2 class="section-title">Font loading</h2>
<div id="fontpanel">
<div class="row">
<label class="filebtn">Load font (.woff .ttf .otf)<input type="file" id="file" accept=".woff,.woff2,.ttf,.otf" hidden></label>
<button id="reset" hidden>Use default font</button>
<span id="fontname">Using Archivo (variable font)</span>
</div>
<div class="row" id="axes"></div>
<div class="row" id="features"></div>
</div>
</div>
</div>
<div class="group">
<h2 class="section-title">Marquee additions</h2>
<section id="sentencepanel" aria-label="Random sentence">
<div id="sentence" aria-live="polite"></div>
<div class="row sentence-actions">
<button id="generate">Generate</button>
<button class="primary" id="add">Add</button>
</div>
<span id="sentenceStatus" role="status"></span>
</section>
</div>
</div>
<div id="stage"></div>
</div>
<footer id="marquee" role="marquee" aria-label="Added sentences">
<div class="marquee-track" id="marqueeTrack"></div>
</footer>
 
<dialog id="pwdialog" aria-labelledby="pwtitle">
<form id="pwform" autocomplete="off">
<h2 id="pwtitle">Clear Canvas</h2>
<p id="pwmsg">Enter the password to remove every word from the canvas.</p>
<input type="text" id="pwinput" placeholder="Password" aria-label="Password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
<div id="pwerror" role="alert"></div>
<div class="row dialog-actions">
<button type="button" id="pwcancel">Cancel</button>
<button type="submit" class="primary" id="pwok">Clear Canvas</button>
</div>
</form>
</dialog>
 
<!-- script.js imports validate.js, profanityfilter.js, sentence.js and Rules.js itself -->
<script src="script.js" type="module"></script>
</body>
</html>
